# 当前环境名称
spring.profiles.active=${profiles.name}

# 指定默认不自动化配置相关模块，通过JavaConfig指定加载
spring.autoconfigure.exclude[0]=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.cache.autoconfigure.CacheAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
spring.autoconfigure.exclude[3]=org.springframework.boot.quartz.autoconfigure.QuartzAutoConfiguration
spring.autoconfigure.exclude[4]=org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration

# 使用CGLIB
spring.aop.proxy-target-class=true

server.tomcat.uri-encoding=UTF-8

# 全局端口定义
port.gateway=8081
port.boot.admin=8766
port.login=9001
port.article=9003
port.behavior=9004
port.user=9005
port.media=9006
port.admin=9007
port.crawler=9008
port.websocket=9009
port.images=9010
port.quartz=9011
port.migration=9012

# ServicesName 微服务名称
sn.gataway=xftt-gateway
sn.boot.admin=xftt-boot-admin-server
sn.login=xftt-login
sn.behavior=xftt-behavior
sn.article=xftt-article
sn.user=xftt-user
sn.media=xftt-media
sn.admin=xftt-admin
sn.crawler=xftt-crawler
sn.quartz=xftt-quartz
sn.migration=xftt-migration
sn.websocket=xftt-websocket
sn.images=xftt-images
