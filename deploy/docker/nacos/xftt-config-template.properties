# =============================================================
# Nacos 配置集公共模板（命名空间 xftt / DEFAULT_GROUP / properties）
# 版本与端口按《部署手册-中间件与数据》(2026-11) 定版：
#   MySQL 8.4.13 · Redis 8.10.3 · Kafka 4.4.0 · Elasticsearch 9.5.7 ·
#   MongoDB 8.2.12 · ZooKeeper 3.9.x · MinIO RELEASE.2026-06-06T02-44-06Z · Nacos 3.3.0
# 全部走 §3 标准端口，默认地址 192.168.20.88。
# 使用：import-nacos.sh 对每个服务 Data ID 渲染本模板并发布。
# =============================================================

# ---------- MySQL（共享栈 8.4.13，业务账号 xf/123456；分库分表恢复后改指 8066）----------
mysql.core.jdbc.url=jdbc:mysql://192.168.20.88:3306/xftt?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
mysql.core.jdbc.username=xf
mysql.core.jdbc.password=123456
mysql.core.jdbc.driver=com.mysql.cj.jdbc.Driver
mysql.core.root-mapper=mappers
mysql.core.aliases.package=com.xftt.model
mysql.core.tx.scan.package=com.xftt

# ---------- Redis（共享栈 8.10.3）----------
spring.data.redis.host=192.168.20.88
spring.data.redis.port=6379
spring.data.redis.password=123456
spring.data.redis.timeout=90000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.max-wait=-1
spring.data.redis.lettuce.pool.min-idle=0

# ---------- Kafka（4.4.0，KRaft 无 ZK）----------
kafka.hosts=192.168.20.88:9092
kafka.group=xftt.${profiles.name}.${spring.application.name}

# ---------- Elasticsearch（9.5.7，客户端 elasticsearch-java 9.5.7）----------
spring.elasticsearch.uris=http://192.168.20.88:9200
spring.elasticsearch.connection-timeout=20s
spring.elasticsearch.socket-timeout=20s

# ---------- MinIO（共享栈 RELEASE.2026-06-06T02-44-06Z，凭据 minioadmin/itxinfei123）----------
minio.endpoint=http://192.168.20.88:9000
minio.access-key=minioadmin
minio.secret-key=itxinfei123
minio.bucket=xftt
minio.public-url=http://192.168.20.88:9000/xftt/

# ---------- MongoDB（8.2.12，热点数据）----------
mongo.host=192.168.20.88
mongo.port=27017
mongo.dbname=xftt

# ---------- ZooKeeper（3.9.x，仅行为序列号；HBase 遗留）----------
zk.host=192.168.20.88:2181
zk.sequence-path=/xftt/sequence/
hbase.zookeeper.quorum=192.168.20.88:2181
hbase.client.keyvalue.maxsize=500000

# ---------- Quartz ----------
spring.quartz.group-prefix=${spring.application.name}_
spring.quartz.scheduler-name=quartz.${profiles.name}.${spring.application.name}

# ---------- 阿里云（OCR / 人脸，敏感）----------
aliyun.access-key=<从旧环境复制>
aliyun.secret=<从旧环境复制>
